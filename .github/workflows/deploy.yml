name: Build Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/thyroidnet:latest \
            .


      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/thyroidnet:latest


      # 5. Install Render CLI
      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      # 6. Check Render CLI
      - name: Check Render CLI
        run: |
          render --version


      # 7. Set Render workspace
      - name: Set Render workspace
        env:
          RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
        run: |
          render workspace set "$RENDER_WORKSPACE_ID"


      # 8. Deploy existing Render service
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/thyroidnet:latest
        run: |
          echo "Deploying Docker image:"
          echo "$DOCKER_IMAGE"

          render deploys create \
            srv-da08l9e1egvs7385m1l0 \
            --image "$DOCKER_IMAGE" \
            --confirm


      # 9. Show public URL
      - name: Show public URL
        run: |
          echo "=========================================="
          echo "THYROIDNET DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Public URL:"
          echo "https://thyroidnet.onrender.com"
          echo "=========================================="